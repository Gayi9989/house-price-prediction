<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            width: 420px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        #error {
            margin-top: 15px;
            color: red;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>House Price Prediction</h1>

        <label>Area (sq.ft)</label>
        <input
            type="number"
            id="area"
            placeholder="Example: 1500"
        >

        <label>Bedrooms</label>
        <input
            type="number"
            id="bedrooms"
            placeholder="Example: 3"
        >

        <label>Bathrooms</label>
        <input
            type="number"
            id="bathrooms"
            placeholder="Example: 2"
        >

        <label>House Age</label>
        <input
            type="number"
            id="age"
            placeholder="Example: 5"
        >

        <button onclick="predictPrice()">
            Predict House Price
        </button>

        <div id="result"></div>

        <div id="error"></div>

    </div>


    <script>

        async function predictPrice() {

            const area = Number(
                document.getElementById("area").value
            );

            const bedrooms = Number(
                document.getElementById("bedrooms").value
            );

            const bathrooms = Number(
                document.getElementById("bathrooms").value
            );

            const age = Number(
                document.getElementById("age").value
            );


            if (!area || !bedrooms || !bathrooms || age < 0) {

                document.getElementById("error").innerText =
                    "Please enter valid values.";

                return;
            }


            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        area: area,
                        bedrooms: bedrooms,
                        bathrooms: bathrooms,
                        age: age
                    })

                });


                const data = await response.json();


                if (!response.ok) {
                    throw new Error("Prediction failed");
                }


                const price =
                    Number(data.predicted_price);


                document.getElementById("result").style.display =
                    "block";

                document.getElementById("result").innerText =
                    "Predicted House Price: ₹" +
                    price.toLocaleString("en-IN");


                document.getElementById("error").innerText = "";

            }

            catch (error) {

                document.getElementById("error").innerText =
                    "Unable to get prediction.";

            }

        }

    </script>

</body>

</html>
